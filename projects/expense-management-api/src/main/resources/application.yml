spring:
  application:
    name: expense-management-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:expenses;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html