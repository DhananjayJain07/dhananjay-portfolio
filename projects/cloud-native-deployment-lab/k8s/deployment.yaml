apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-lab
  labels:
    app: cloud-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-lab
  template:
    metadata:
      labels:
        app: cloud-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: ghcr.io/REPLACE_OWNER/cloud-lab:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-lab
spec:
  selector:
    app: cloud-lab
  ports:
    - port: 80
      targetPort: http
  type: ClusterIP