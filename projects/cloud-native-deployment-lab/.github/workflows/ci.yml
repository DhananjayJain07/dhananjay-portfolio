name: Cloud Lab CI
on:
  push:
    paths:
      - 'projects/cloud-native-deployment-lab/**'
  pull_request:
    paths:
      - 'projects/cloud-native-deployment-lab/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/cloud-native-deployment-lab/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test